[project]
name = "dream-ai-dynamic-lora"
version = "0.1.0"
description = "Dynamic LoRA training experiments for Manim code generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
    "accelerate>=1.1,<2",
    "bitsandbytes>=0.43,<1",
    "datasets>=2.21,<3",
    "peft>=0.12,<1",
    "safetensors>=0.4,<1",
    "torch>=2.4,<3",
    "transformers>=4.51,<5",
    "wandb>=0.18,<1",
]

[project.scripts]
shared-lora-baseline = "dynamic_lora.cli:main"
dynamic-lora = "dynamic_lora.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "mypy>=1.14,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
files = ["src"]
