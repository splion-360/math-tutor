name: math-tutor

services:
  manim:
    image: manimcommunity/manim@sha256:ab5ad56cf685d89da96e5d459e0cde3743fbdf2141be4dcff6c26566b5ca3191
    entrypoint: ["python", "-c", "import manim"]

  manim-voiceover:
    build:
      context: ./backend
      dockerfile: renderer.Dockerfile
    image: math-tutor-manim-voiceover:local
    pull_policy: build
    entrypoint: ["python", "-c", "import manim_voiceover"]

  backend:
    build:
      context: ./backend
      target: development
    working_dir: ${PWD:?Run Docker Compose from the repository root}/backend
    environment:
      PYTHONPATH: ${PWD:?Run Docker Compose from the repository root}/backend/src
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # The identical host/container path lets the host Docker daemon mount
      # per-job scene and artifact paths into short-lived Manim containers.
      - .:${PWD:?Run Docker Compose from the repository root}
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      manim:
        condition: service_completed_successfully
      manim-voiceover:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  frontend_node_modules:
