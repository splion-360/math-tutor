<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
  <title id="title">Math Tutor lesson generation and validation workflow</title>
  <desc id="description">A learner prompt passes through a shared LoRA, source admission, Manim rendering, and narration assembly. Media, layout, and visual validators run in parallel. A deterministic aggregator publishes the lesson, permits one repair, or stops publication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a" /></marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6366f1" /></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626" /></marker>
    <style>
      .box{stroke-width:1.6}.title{font:600 15px Inter,Arial,sans-serif;fill:#0f172a}.body{font:13px Inter,Arial,sans-serif;fill:#475569}.label{font:600 12px Inter,Arial,sans-serif}.edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="940" fill="#ffffff" />
  <text x="40" y="42" style="font:700 23px Inter,Arial,sans-serif;fill:#0f172a">From prompt to validated visual lesson</text>
  <text x="40" y="68" style="font:13px Inter,Arial,sans-serif;fill:#64748b">Generation, rendering, narration, and independent output checks share one bounded repair loop.</text>

  <path class="edge" d="M220 144 H270" /><path class="edge" d="M460 144 H510" /><path class="edge" d="M700 144 H750" /><path class="edge" d="M940 144 H990" />
  <g><rect class="box" x="40" y="100" width="180" height="88" rx="12" fill="#eef2ff" stroke="#818cf8" /><text class="title" x="130" y="134" text-anchor="middle">Learner prompt</text><text class="body" x="130" y="160" text-anchor="middle">Math question</text></g>
  <g><rect class="box" x="270" y="100" width="190" height="88" rx="12" fill="#eef2ff" stroke="#818cf8" /><text class="title" x="365" y="134" text-anchor="middle">Shared LoRA</text><text class="body" x="365" y="160" text-anchor="middle">Generate Manim source</text></g>
  <g><rect class="box" x="510" y="92" width="190" height="104" rx="12" fill="#fff7ed" stroke="#fb923c" /><text class="title" x="605" y="123" text-anchor="middle">Source admission</text><text class="body" x="605" y="149" text-anchor="middle">Syntax + AST</text><text class="body" x="605" y="173" text-anchor="middle">Manim API policy</text></g>
  <g><rect class="box" x="750" y="92" width="190" height="104" rx="12" fill="#f8fafc" stroke="#64748b" /><text class="title" x="845" y="123" text-anchor="middle">Manim render</text><text class="body" x="845" y="149" text-anchor="middle">Isolated container</text><text class="body" x="845" y="173" text-anchor="middle">Video + spatial trace</text></g>
  <g><rect class="box" x="990" y="92" width="190" height="104" rx="12" fill="#f0fdfa" stroke="#2dd4bf" /><text class="title" x="1085" y="123" text-anchor="middle">Narration assembly</text><text class="body" x="1085" y="149" text-anchor="middle">Speech + captions</text><text class="body" x="1085" y="173" text-anchor="middle">Muxed preview</text></g>

  <path class="edge" d="M1085 196 V222 H600 V250" />
  <g><rect class="box" x="415" y="250" width="370" height="104" rx="12" fill="#f8fafc" stroke="#64748b" /><text class="title" x="600" y="281" text-anchor="middle">Immutable validation input</text><text class="body" x="600" y="307" text-anchor="middle">Prompt + admitted source + media</text><text class="body" x="600" y="331" text-anchor="middle">Spatial trace + expected checks</text></g>

  <rect x="150" y="410" width="900" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="label" x="172" y="438" fill="#334155">PARALLEL OUTPUT VALIDATION</text>
  <path class="edge" d="M600 354 V384 H310 V472" /><path class="edge" d="M600 354 V472" /><path class="edge" d="M600 384 H890 V472" />
  <g><rect class="box" x="190" y="472" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#6ee7b7" /><text class="title" x="310" y="501" text-anchor="middle">Media</text><text class="body" x="310" y="527" text-anchor="middle">Streams + duration</text><text class="body" x="310" y="551" text-anchor="middle">Narration + captions</text></g>
  <g><rect class="box" x="480" y="472" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#6ee7b7" /><text class="title" x="600" y="501" text-anchor="middle">Layout</text><text class="body" x="600" y="527" text-anchor="middle">Bounds + margins</text><text class="body" x="600" y="551" text-anchor="middle">Size + overlap</text></g>
  <g><rect class="box" x="770" y="472" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#6ee7b7" /><text class="title" x="890" y="501" text-anchor="middle">Visual evidence</text><text class="body" x="890" y="527" text-anchor="middle">Sampled frames + bounded checks</text><text class="body" x="890" y="551" text-anchor="middle">One schema retry</text></g>

  <path class="edge" d="M310 568 V622 H600 V650" /><path class="edge" d="M600 568 V650" /><path class="edge" d="M890 568 V622 H600 V650" />
  <g><rect class="box" x="430" y="650" width="340" height="88" rx="12" fill="#fff7ed" stroke="#fb923c" /><text class="title" x="600" y="684" text-anchor="middle">Deterministic aggregator</text><text class="body" x="600" y="710" text-anchor="middle">Status precedence + controlled findings</text></g>

  <path d="M545 738 V778 H215 V790" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" /><rect x="346" y="746" width="46" height="20" rx="4" fill="#ffffff" /><text class="label" x="369" y="760" text-anchor="middle" fill="#166534">pass</text>
  <path d="M600 738 V790" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)" /><rect x="612" y="746" width="100" height="20" rx="4" fill="#ffffff" /><text class="label" x="662" y="760" text-anchor="middle" fill="#4338ca">repairable fail</text>
  <path d="M700 738 V778 H985 V782" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" /><rect x="792" y="746" width="108" height="20" rx="4" fill="#ffffff" /><text class="label" x="846" y="760" text-anchor="middle" fill="#991b1b">no safe repair</text>
  <g><rect class="box" x="90" y="790" width="250" height="82" rx="12" fill="#ecfdf5" stroke="#22c55e" /><text class="title" x="215" y="822" text-anchor="middle">Publish lesson</text><text class="body" x="215" y="848" text-anchor="middle">Validated narrated video</text></g>
  <g><rect class="box" x="475" y="790" width="250" height="82" rx="12" fill="#eef2ff" stroke="#818cf8" /><text class="title" x="600" y="822" text-anchor="middle">One Qwen repair</text><text class="body" x="600" y="848" text-anchor="middle">Confirmed repair instructions only</text></g>
  <g><rect class="box" x="860" y="782" width="250" height="98" rx="12" fill="#fef2f2" stroke="#f87171" /><text class="title" x="985" y="811" text-anchor="middle">Stop publication</text><text class="body" x="985" y="837" text-anchor="middle">Uncertain or validator error</text><text class="body" x="985" y="861" text-anchor="middle">Repair exhausted</text></g>

  <path d="M600 872 V910 H28 V226 H365 V188" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-indigo)" />
  <text class="label" x="48" y="902" fill="#4338ca">regenerate</text>
</svg>
