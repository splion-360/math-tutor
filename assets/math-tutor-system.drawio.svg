<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title description">
  <title id="title">Math Tutor validated lesson generation</title>
  <desc id="description">A prompt is routed, generated, admitted, rendered, and recorded as an immutable input. Media, spatial, and visual validators run in parallel. A deterministic aggregator publishes, permits one repair, or stops publication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a" /></marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6366f1" /></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626" /></marker>
    <style>.box{stroke-width:1.5}.title{font:600 14px Inter,Arial,sans-serif;fill:#0f172a}.body{font:12px Inter,Arial,sans-serif;fill:#475569}.label{font:600 12px Inter,Arial,sans-serif}.edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="940" fill="#ffffff" />
  <text x="40" y="42" style="font:700 22px Inter,Arial,sans-serif;fill:#0f172a">Validated lesson generation</text>
  <text x="40" y="66" style="font:13px Inter,Arial,sans-serif;fill:#64748b">Every output validator reads the same immutable attempt and reports on one independent axis.</text>

  <path class="edge" d="M250 136 H310" /><path class="edge" d="M480 136 H540" /><path class="edge" d="M710 136 H770" /><path class="edge" d="M940 136 H1000" />
  <rect class="box" x="80" y="100" width="170" height="72" rx="12" fill="#eef2ff" stroke="#818cf8" /><text class="title" x="165" y="129" text-anchor="middle">Lesson request</text><text class="body" x="165" y="152" text-anchor="middle">Prompt + optional difficulty</text>
  <rect class="box" x="310" y="100" width="170" height="72" rx="12" fill="#ffffff" stroke="#94a3b8" /><text class="title" x="395" y="129" text-anchor="middle">Route request</text><text class="body" x="395" y="152" text-anchor="middle">Base or difficulty adapter</text>
  <rect class="box" x="540" y="100" width="170" height="72" rx="12" fill="#eef2ff" stroke="#818cf8" /><text class="title" x="625" y="129" text-anchor="middle">Generate scene</text><text class="body" x="625" y="152" text-anchor="middle">Manim source</text>
  <rect class="box" x="770" y="100" width="170" height="72" rx="12" fill="#fff7ed" stroke="#fb923c" /><text class="title" x="855" y="129" text-anchor="middle">Source admission</text><text class="body" x="855" y="152" text-anchor="middle">Parse · AST · API policy</text>
  <rect class="box" x="1000" y="100" width="170" height="72" rx="12" fill="#ffffff" stroke="#94a3b8" /><text class="title" x="1085" y="129" text-anchor="middle">Isolated render</text><text class="body" x="1085" y="152" text-anchor="middle">Video · audio · captions</text>

  <path class="edge" d="M1085 172 V210 H750 V240" />
  <rect class="box" x="625" y="240" width="250" height="82" rx="12" fill="#f8fafc" stroke="#64748b" /><text class="title" x="750" y="269" text-anchor="middle">Immutable validation input</text><text class="body" x="750" y="292" text-anchor="middle">Prompt · source · media · timeline</text><text class="body" x="750" y="311" text-anchor="middle">expected checks</text>

  <rect x="400" y="390" width="700" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" /><text class="label" x="420" y="420" fill="#334155">Parallel output validation</text>
  <path class="edge" d="M750 322 V365 H522 V445" /><path class="edge" d="M750 322 V445" /><path class="edge" d="M750 365 H978 V445" />
  <rect class="box" x="435" y="445" width="175" height="100" rx="10" fill="#ecfdf5" stroke="#6ee7b7" /><text class="title" x="522.5" y="475" text-anchor="middle">Media</text><text class="body" x="522.5" y="499" text-anchor="middle">Streams · duration</text><text class="body" x="522.5" y="521" text-anchor="middle">audio · captions</text>
  <rect class="box" x="662" y="445" width="175" height="100" rx="10" fill="#ecfdf5" stroke="#6ee7b7" /><text class="title" x="749.5" y="475" text-anchor="middle">Spatial</text><text class="body" x="749.5" y="499" text-anchor="middle">Bounds · margins</text><text class="body" x="749.5" y="521" text-anchor="middle">size · overlap</text>
  <rect class="box" x="890" y="445" width="175" height="100" rx="10" fill="#ecfdf5" stroke="#6ee7b7" /><text class="title" x="977.5" y="475" text-anchor="middle">Visual evidence</text><text class="body" x="977.5" y="499" text-anchor="middle">Sampled frames</text><text class="body" x="977.5" y="521" text-anchor="middle">bounded VLM checks</text>

  <path class="edge" d="M522 545 V605 H750 V630" /><path class="edge" d="M750 545 V630" /><path class="edge" d="M978 545 V605 H750 V630" />
  <rect class="box" x="625" y="630" width="250" height="72" rx="12" fill="#fff7ed" stroke="#fb923c" /><text class="title" x="750" y="659" text-anchor="middle">Deterministic aggregator</text><text class="body" x="750" y="682" text-anchor="middle">Ordered statuses + structured evidence</text>

  <path d="M700 702 V730 H405 V760" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" /><text class="label" x="500" y="723" fill="#166534">pass</text>
  <path d="M750 702 V760" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)" /><text class="label" x="765" y="738" fill="#4338ca">repairable fail · attempt 0</text>
  <path d="M800 702 V730 H1095 V760" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" /><text class="label" x="925" y="723" fill="#991b1b">no supported repair</text>
  <rect class="box" x="300" y="760" width="210" height="72" rx="12" fill="#ecfdf5" stroke="#22c55e" /><text class="title" x="405" y="789" text-anchor="middle">Publish lesson</text><text class="body" x="405" y="812" text-anchor="middle">Video + validation summary</text>
  <rect class="box" x="645" y="760" width="210" height="72" rx="12" fill="#eef2ff" stroke="#818cf8" /><text class="title" x="750" y="789" text-anchor="middle">One repair attempt</text><text class="body" x="750" y="812" text-anchor="middle">Confirmed repairable findings only</text>
  <rect class="box" x="990" y="760" width="210" height="72" rx="12" fill="#fef2f2" stroke="#f87171" /><text class="title" x="1095" y="789" text-anchor="middle">Stop publication</text><text class="body" x="1095" y="812" text-anchor="middle">Uncertain · validator error · failed repair</text>
  <path d="M645 796 H160 V210 H625 V180" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-indigo)" /><text class="label" x="175" y="780" fill="#4338ca">regenerate</text>
</svg>
