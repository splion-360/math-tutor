<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title description">
  <title id="title">Math Tutor validated lesson generation</title>
  <desc id="description">A prompt is routed to a generator, admitted, rendered, and recorded as an immutable validation input. Media, spatial, and visual validators run in parallel. A deterministic aggregator publishes a passing lesson, permits one evidence-based repair, or stops publication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b" /></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a" /></marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6366f1" /></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626" /></marker>
    <style>
      .box{stroke-width:1.5}.title{font:600 14px Inter,Arial,sans-serif;fill:#0f172a}.body{font:12px Inter,Arial,sans-serif;fill:#475569}.label{font:600 12px Inter,Arial,sans-serif}.edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="760" fill="#ffffff" />
  <text x="30" y="42" style="font:700 22px Inter,Arial,sans-serif;fill:#0f172a">Validated lesson generation</text>
  <text x="30" y="66" style="font:13px Inter,Arial,sans-serif;fill:#64748b">Each validator reads the same immutable attempt and reports on one independent axis.</text>

  <path class="edge" d="M195 352 H230" />
  <path class="edge" d="M395 352 H430" />
  <path class="edge" d="M595 352 H630" />
  <path class="edge" d="M795 352 H830" />
  <path class="edge" d="M995 352 H1030" />

  <rect class="box" x="30" y="315" width="165" height="74" rx="12" fill="#eef2ff" stroke="#818cf8" />
  <text class="title" x="112.5" y="343" text-anchor="middle">Lesson request</text>
  <text class="body" x="112.5" y="366" text-anchor="middle">Prompt + optional difficulty</text>

  <rect class="box" x="230" y="315" width="165" height="74" rx="12" fill="#ffffff" stroke="#94a3b8" />
  <text class="title" x="312.5" y="343" text-anchor="middle">Route request</text>
  <text class="body" x="312.5" y="366" text-anchor="middle">Base or difficulty adapter</text>

  <rect class="box" x="430" y="315" width="165" height="74" rx="12" fill="#eef2ff" stroke="#818cf8" />
  <text class="title" x="512.5" y="343" text-anchor="middle">Generate scene</text>
  <text class="body" x="512.5" y="366" text-anchor="middle">Manim source</text>

  <rect class="box" x="630" y="315" width="165" height="74" rx="12" fill="#fff7ed" stroke="#fb923c" />
  <text class="title" x="712.5" y="343" text-anchor="middle">Source admission</text>
  <text class="body" x="712.5" y="366" text-anchor="middle">Parse · AST · API policy</text>

  <rect class="box" x="830" y="315" width="165" height="74" rx="12" fill="#ffffff" stroke="#94a3b8" />
  <text class="title" x="912.5" y="343" text-anchor="middle">Isolated render</text>
  <text class="body" x="912.5" y="366" text-anchor="middle">Video · audio · captions</text>

  <rect class="box" x="1030" y="302" width="190" height="100" rx="12" fill="#f8fafc" stroke="#64748b" />
  <text class="title" x="1125" y="330" text-anchor="middle">Immutable validation input</text>
  <text class="body" x="1125" y="353" text-anchor="middle">Prompt · source · media</text>
  <text class="body" x="1125" y="374" text-anchor="middle">timeline · expected checks</text>

  <rect x="1015" y="95" width="430" height="156" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="label" x="1035" y="123" fill="#334155">Parallel output validation</text>

  <rect class="box" x="1035" y="141" width="115" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" />
  <text class="title" x="1092.5" y="166" text-anchor="middle">Media</text>
  <text class="body" x="1092.5" y="187" text-anchor="middle">Streams · duration</text>
  <text class="body" x="1092.5" y="206" text-anchor="middle">audio · captions</text>

  <rect class="box" x="1172" y="141" width="115" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" />
  <text class="title" x="1229.5" y="166" text-anchor="middle">Spatial</text>
  <text class="body" x="1229.5" y="187" text-anchor="middle">Bounds · margins</text>
  <text class="body" x="1229.5" y="206" text-anchor="middle">size · overlap</text>

  <rect class="box" x="1309" y="141" width="115" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" />
  <text class="title" x="1366.5" y="166" text-anchor="middle">Visual evidence</text>
  <text class="body" x="1366.5" y="187" text-anchor="middle">Sampled frames</text>
  <text class="body" x="1366.5" y="206" text-anchor="middle">bounded VLM checks</text>

  <path class="edge" d="M1080 302 V272 H1092 V233" />
  <path class="edge" d="M1125 302 V272 H1229 V233" />
  <path class="edge" d="M1170 302 V272 H1366 V233" />
  <path class="edge" d="M1092 141 V112 H1470 V340 H1450" />
  <path class="edge" d="M1229 141 V122 H1460 V352 H1450" />
  <path class="edge" d="M1366 141 V132 H1450 V364" />

  <rect class="box" x="1260" y="315" width="190" height="74" rx="12" fill="#fff7ed" stroke="#fb923c" />
  <text class="title" x="1355" y="343" text-anchor="middle">Deterministic aggregator</text>
  <text class="body" x="1355" y="366" text-anchor="middle">Statuses + structured evidence</text>

  <path d="M1355 389 V458" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text class="label" x="1366" y="430" fill="#166534">pass</text>
  <rect class="box" x="1260" y="465" width="190" height="74" rx="12" fill="#ecfdf5" stroke="#22c55e" />
  <text class="title" x="1355" y="493" text-anchor="middle">Publish lesson</text>
  <text class="body" x="1355" y="516" text-anchor="middle">Video + validation summary</text>

  <path d="M1305 389 V590 H1062" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)" />
  <text class="label" x="1085" y="575" fill="#4338ca">repairable fail · attempt 0</text>
  <rect class="box" x="830" y="555" width="232" height="74" rx="12" fill="#eef2ff" stroke="#818cf8" />
  <text class="title" x="946" y="583" text-anchor="middle">One repair attempt</text>
  <text class="body" x="946" y="606" text-anchor="middle">Confirmed repairable findings only</text>
  <path d="M830 592 H512 V397" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-indigo)" />
  <text class="label" x="527" y="578" fill="#4338ca">regenerate</text>

  <path d="M1405 389 V590 H1448" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <text class="label" x="1300" y="575" fill="#991b1b">no supported repair</text>
  <rect class="box" x="1215" y="625" width="235" height="74" rx="12" fill="#fef2f2" stroke="#f87171" />
  <text class="title" x="1332.5" y="653" text-anchor="middle">Stop publication</text>
  <text class="body" x="1332.5" y="676" text-anchor="middle">Uncertain · validator error · failed repair</text>
</svg>
